[project]
name = "vits-tts-hf2api"
version = "0.1.0"
description = "VITS-UMA-Genshin-Honkai TTS to OpenAI Audio API"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=13.0",
]

[project.scripts]
vits-tts-hf2api = "vits_tts_hf2api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python/vits_tts_hf2api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.24",
]
