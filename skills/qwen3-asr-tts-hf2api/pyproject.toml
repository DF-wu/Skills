[project]
name = "qwen3-asr-tts-hf2api"
version = "0.1.0"
description = "Qwen3 TTS + ASR to OpenAI Audio API"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.scripts]
qwen3-asr-tts-hf2api = "qwen3_asr_tts_hf2api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python/qwen3_asr_tts_hf2api"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
